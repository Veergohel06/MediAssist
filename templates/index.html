<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="MediAssist – Your AI-powered virtual health assistant for general health information and guidance." />
  <title>MediAssist – Virtual Health Assistant</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>

  <!-- ===== APP SHELL ===== -->
  <div class="app-shell">

    <!-- ===== HEADER ===== -->
    <header class="header" role="banner">
      <div class="header__inner">
        <div class="header__brand">
          <!-- Heartbeat / pulse icon (pure SVG) -->
          <span class="header__icon" aria-hidden="true">
            <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
              <circle cx="20" cy="20" r="20" fill="rgba(255,255,255,0.15)" />
              <polyline
                points="6,20 12,20 15,12 20,28 25,16 28,20 34,20"
                stroke="white" stroke-width="2.5"
                stroke-linecap="round" stroke-linejoin="round"
                fill="none"
              />
            </svg>
          </span>
          <div>
            <h1 class="header__title">MediAssist</h1>
            <p class="header__subtitle">Virtual Health Assistant</p>
          </div>
        </div>
        <!-- Online status pill -->
        <div class="header__status" aria-label="Bot status: Online">
          <span class="status-dot" aria-hidden="true"></span>
          <span>Online</span>
        </div>
      </div>
    </header>

    <!-- ===== CHAT AREA ===== -->
    <main class="chat-container" id="main-content" role="main">

      <!-- Scrollable messages list -->
      <div
        class="messages-area"
        id="messagesArea"
        role="log"
        aria-live="polite"
        aria-label="Chat messages"
      ></div>

      <!-- ===== INPUT BAR ===== -->
      <div class="input-bar" role="region" aria-label="Message input">
        <div class="input-bar__inner">
          <label for="messageInput" class="sr-only">Type your health question</label>
          <textarea
            id="messageInput"
            class="input-bar__textarea"
            placeholder="Type your health question here…"
            rows="1"
            maxlength="2000"
            aria-label="Your message"
          ></textarea>
          <button
            id="sendBtn"
            class="input-bar__send-btn"
            aria-label="Send message"
            type="button"
          >
            <!-- Paper-plane send icon -->
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <path
                d="M22 2L11 13"
                stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round"
              />
              <path
                d="M22 2L15 22L11 13L2 9L22 2Z"
                stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round"
              />
            </svg>
          </button>
        </div>
        <p class="input-bar__hint">
          ⚕️ For emergencies, always call <strong>your local emergency number</strong> (e.g. 911).
        </p>
      </div>

    </main>

  </div><!-- /.app-shell -->

  <script src="/static/app.js"></script>
</body>
</html>
