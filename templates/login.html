{% extends "base.html" %}

{% block title %}Sign In – MediAssist{% endblock %}

{% block content %}
<div class="auth-wrapper">
  <div class="auth-card">
    <div class="auth-header">
      <div class="auth-header__icon" aria-hidden="true">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path>
          <polyline points="10 17 15 12 10 7"></polyline>
          <line x1="15" y1="12" x2="3" y2="12"></line>
        </svg>
      </div>
      <h2 class="auth-title">Welcome Back</h2>
      <p class="auth-subtitle">Sign in to access your protected consultations</p>
    </div>

    <form method="POST" action="{{ url_for('auth.login') }}" novalidate id="loginForm">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
      <input type="hidden" name="next" value="{{ next_url or request.args.get('next', '') }}" />

      <div class="form-group">
        <label for="emailInput" class="form-label">Email Address</label>
        <input
          type="email"
          id="emailInput"
          name="email"
          class="form-control"
          placeholder="doctor@example.com"
          value="{{ request.form.get('email', '') }}"
          required
          autocomplete="email"
          autofocus
        />
      </div>

      <div class="form-group">
        <div style="display: flex; justify-content: space-between; align-items: center;">
          <label for="passwordInput" class="form-label" style="margin-bottom: 0;">Password</label>
          <a href="{{ url_for('auth.reset_password') }}" class="auth-link" style="font-size: 0.8rem;" id="forgotPasswordLink">
            Forgot password?
          </a>
        </div>
        <div class="password-input-wrapper" style="margin-top: 0.35rem;">
          <input
            type="password"
            id="passwordInput"
            name="password"
            class="form-control"
            placeholder="••••••••"
            required
            autocomplete="current-password"
          />
          <button
            type="button"
            class="password-toggle-btn"
            id="togglePasswordBtn"
            aria-label="Toggle password visibility"
            title="Toggle password visibility"
          >
            <svg class="pw-icon-eye" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
            <svg class="pw-icon-eye-off" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
              <line x1="1" y1="1" x2="23" y2="23"></line>
            </svg>
          </button>
        </div>
      </div>

      <div class="form-checkbox-group">
        <input type="checkbox" id="rememberMeInput" name="remember" value="true" class="form-checkbox" />
        <label for="rememberMeInput" class="form-checkbox-label">
          Keep me signed in on this device
        </label>
      </div>

      <button type="submit" class="btn btn-primary btn-block" id="loginSubmitBtn">
        Sign In
      </button>
    </form>

    <div class="auth-footer">
      <span>Don't have an account?</span>
      <a href="{{ url_for('auth.register') }}" class="auth-link" id="toRegisterLink">Create one now</a>
    </div>
  </div>
</div>

<script>
  (function() {
    var toggleBtn = document.getElementById('togglePasswordBtn');
    var passwordInput = document.getElementById('passwordInput');
    if (toggleBtn && passwordInput) {
      var eyeIcon = toggleBtn.querySelector('.pw-icon-eye');
      var eyeOffIcon = toggleBtn.querySelector('.pw-icon-eye-off');
      toggleBtn.addEventListener('click', function() {
        if (passwordInput.type === 'password') {
          passwordInput.type = 'text';
          if (eyeIcon) eyeIcon.style.display = 'none';
          if (eyeOffIcon) eyeOffIcon.style.display = 'block';
        } else {
          passwordInput.type = 'password';
          if (eyeIcon) eyeIcon.style.display = 'block';
          if (eyeOffIcon) eyeOffIcon.style.display = 'none';
        }
      });
    }
  })();
</script>
{% endblock %}
